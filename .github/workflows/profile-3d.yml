name: GitHub Profile 3D Contributions

on:
  schedule:
    # run automatically every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-github-profile-3d-contrib:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: yadavvijay267
      - name: Commit generated 3D contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          git diff --cached --quiet || git commit -m "Generate 3D contribution graph"
          git push
