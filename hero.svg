<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Vijay Kumar Yadav — QC Engineer, Planning and Designing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1628"/>
      <stop offset="0.55" stop-color="#0C1E38"/>
      <stop offset="1" stop-color="#0E2A4A"/>
    </linearGradient>
    <linearGradient id="lineA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#06B6D4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0891B2" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- soft glows -->
  <circle cx="1020" cy="70" r="200" fill="url(#glow)"/>
  <circle cx="120" cy="270" r="170" fill="url(#glow)"/>

  <!-- faint grid dots -->
  <g fill="#06B6D4" opacity="0.12">
    <circle cx="80" cy="40" r="2"/><circle cx="200" cy="40" r="2"/><circle cx="320" cy="40" r="2"/><circle cx="440" cy="40" r="2"/><circle cx="560" cy="40" r="2"/><circle cx="680" cy="40" r="2"/><circle cx="800" cy="40" r="2"/><circle cx="920" cy="40" r="2"/><circle cx="1040" cy="40" r="2"/><circle cx="1120" cy="40" r="2"/>
    <circle cx="80" cy="260" r="2"/><circle cx="200" cy="260" r="2"/><circle cx="320" cy="260" r="2"/><circle cx="440" cy="260" r="2"/><circle cx="560" cy="260" r="2"/><circle cx="680" cy="260" r="2"/><circle cx="800" cy="260" r="2"/><circle cx="920" cy="260" r="2"/><circle cx="1040" cy="260" r="2"/><circle cx="1120" cy="260" r="2"/>
  </g>

  <!-- fiber routes (animated dashes = signal travelling along the line) -->
  <path d="M-20 245 C 280 180, 520 265, 820 150 S 1140 95, 1240 130" fill="none" stroke="url(#lineA)" stroke-width="2.5" stroke-dasharray="7 11">
    <animate attributeName="stroke-dashoffset" from="72" to="0" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M-20 90 C 260 140, 480 60, 760 120 S 1080 210, 1240 175" fill="none" stroke="url(#lineB)" stroke-width="2" stroke-dasharray="5 13">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="3.4s" repeatCount="indefinite"/>
  </path>
  <path d="M-20 180 C 320 210, 620 130, 900 190 S 1120 240, 1240 210" fill="none" stroke="#06B6D4" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 9">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- network nodes (pulsing) -->
  <g>
    <circle cx="300" cy="206" r="5" fill="#06B6D4">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="128" r="5" fill="#22D3EE">
      <animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="188" r="5" fill="#06B6D4">
      <animate attributeName="r" values="4;7;4" dur="2.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.45;1" dur="2.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="150" r="4" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="1060" cy="142" r="4" fill="#22D3EE" opacity="0.85"/>
  </g>

  <!-- hexagon motif (echoes the VY logo mark) -->
  <g fill="none" stroke="#06B6D4" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M1085 55 L1115 72 L1115 106 L1085 123 L1055 106 L1055 72 Z"/>
    <path d="M1085 70 L1102 80 L1102 100 L1085 110 L1068 100 L1068 80 Z" stroke-opacity="0.25"/>
  </g>
  <text x="1085" y="101" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#06B6D4" opacity="0.8">VY</text>

  <!-- identity text -->
  <text x="60" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">Vijay Kumar Yadav</text>
  <text x="62" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#06B6D4">QC Engineer · Planning &amp; Designing</text>
  <text x="62" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#94A3B8">I catch design errors before they reach the field.</text>

  <!-- bottom accent rule -->
  <rect x="60" y="252" width="180" height="3" rx="1.5" fill="#06B6D4"/>
  <rect x="248" y="252" width="60" height="3" rx="1.5" fill="#22D3EE" opacity="0.6"/>
</svg>
